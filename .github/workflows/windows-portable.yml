name: Windows portable release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build self-contained Windows package
        run: python scripts/build_windows.py
      - name: Test the actual bundled Windows runtimes
        shell: pwsh
        run: |
          Expand-Archive dist/Nexys-Lab-Windows-x64.zip -DestinationPath portable
          Set-Location portable/Nexys-Lab
          $env:GHDL_PATH = (Resolve-Path runtime/ghdl/bin/ghdl.exe).Path
          $output = & runtime/python/python.exe -m unittest discover -v 2>&1
          $result = $LASTEXITCODE
          $text = ($output | ForEach-Object { $_.ToString() }) -join "`n"
          Write-Output $text
          if ($result -ne 0) {
            $detail = $text.Substring([Math]::Max(0, $text.Length - 3500)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Bundled Windows integration tests::$detail"
            exit $result
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test highlighting and diagnostic parsing
        run: |
          node scripts/test_editor_tools.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_pacing.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test_editor_diagnostics.js test_wave_viewer.js test_pacing_metrics.js
      - name: Install browser regression tools (not shipped in the app)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Test switch and GO through the real Windows browser app
        shell: pwsh
        run: |
          $app = (Resolve-Path portable/Nexys-Lab).Path
          $python = Join-Path $app runtime/python/python.exe
          $server = Start-Process -FilePath $python -ArgumentList @('server.py', '--port', '8011') -WorkingDirectory $app -PassThru -RedirectStandardOutput server-out.log -RedirectStandardError server-error.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              try { $health = Invoke-RestMethod http://127.0.0.1:8011/api/health; if ($health.ok) { $ready = $true; break } } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Portable server did not become ready' }
            $env:NEXYS_LAB_URL = 'http://127.0.0.1:8011'
            node scripts/check_interaction.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Switch/GO browser regression failed' }
            node scripts/check_generic.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Generic project browser regression failed' }
            node scripts/check_editor.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Editor and diagnostics browser regression failed' }
            node scripts/check_pacing.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Adaptive pacing browser regression failed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nexys-Lab-Windows-x64
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nexys-Lab-Windows-x64
          path: dist
      - name: Publish tested Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Nexys Lab $RELEASE_TAG — Windows portable" --notes "Windows 10/11 x64 portable package. Includes Python and GHDL. Extract the full ZIP, then double-click Start-Nexys-Lab.cmd. No separate simulator installation or PATH setup is required. The bundled Windows runtimes passed the integration tests before this release."
