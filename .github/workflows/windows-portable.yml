name: Windows portable release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build self-contained Windows package
        run: python scripts/build_windows.py
      - name: Test the actual bundled Windows runtimes
        shell: pwsh
        run: |
          Expand-Archive dist/Nexys-Lab-Windows-x64.zip -DestinationPath portable
          Set-Location portable/Nexys-Lab
          $env:GHDL_PATH = (Resolve-Path runtime/ghdl/bin/ghdl.exe).Path
          & runtime/python/python.exe -m unittest -v test_lab.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Nexys-Lab-Windows-x64
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nexys-Lab-Windows-x64
          path: dist
      - name: Publish tested Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Nexys Lab $RELEASE_TAG — Windows portable" --notes "Windows 10/11 x64 portable package. Includes Python and GHDL. Extract the full ZIP, then double-click Start-Nexys-Lab.cmd. No separate simulator installation or PATH setup is required. The bundled Windows runtimes passed the integration tests before this release."
